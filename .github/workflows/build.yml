name: Build

# Every push and pull request: test and build on Windows and macOS, downloadable from the run's Artifacts.
# Pushing a tag like v2.0.0 also publishes the builds as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
    env:
      QT_QPA_PLATFORM: offscreen
      # The self-test also tries a real update request and reports what it got (informational).
      LPARC_SELFTEST_UPDATE_URL: https://github.com/kkonkobo/lparc-photo/releases/latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv run pyinstaller packaging/lparc_photo.spec --noconfirm

      # Runs the packaged app itself, without a window or camera: finds a face in a test portrait and
      # replaces its background. Catches anything the bundle is missing on this platform.
      - name: Self-test the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/LPARC Photo.app/Contents/MacOS/LPARC Photo" --self-test tests/data/portrait.jpg selftest.json || status=$?
          cat selftest.json
          exit ${status:-0}

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A windowed app has no console, so wait for it explicitly and read its report file.
          $p = Start-Process -FilePath "dist/LPARC Photo/LPARC Photo.exe" -WorkingDirectory $PWD `
            -ArgumentList '--self-test', 'tests/data/portrait.jpg', 'selftest.json' -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json } else { Write-Host "no report written" }
          exit $p.ExitCode

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          $version = uv run python -c "import lparc_photo; print(lparc_photo.__version__)"
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\LPARC-Photo-windows-x64-setup.exe" "LPARC-Photo-${{ matrix.name }}-setup.exe"

      # Installs silently, runs the installed app's self-test, upgrades in place, then uninstalls.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "LPARC-Photo-${{ matrix.name }}-setup.exe"
          $app = Join-Path $env:LOCALAPPDATA "Programs\LPARC Photo"
          $exe = Join-Path $app "LPARC Photo.exe"
          function Install($log) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exited with $($p.ExitCode)" }
          }
          Install "install.log"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 40; throw "app not installed at $exe" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\LPARC Photo.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start-menu shortcut missing" }

          $t = Start-Process $exe -WorkingDirectory $PWD -ArgumentList '--self-test', 'tests/data/portrait.jpg', 'selftest-installed.json' -Wait -PassThru
          if (Test-Path selftest-installed.json) { Get-Content selftest-installed.json } else { Write-Host "no report written" }
          if ($t.ExitCode -ne 0) { throw "installed app failed its self-test" }

          # Upgrade in place: a leftover file from an "older version" must be gone afterwards.
          Set-Content (Join-Path $app "_internal\stale-from-old-version.txt") "x"
          Install "upgrade.log"
          if (Test-Path (Join-Path $app "_internal\stale-from-old-version.txt")) { throw "upgrade left old files behind" }
          $entries = @(Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.GetValue("DisplayName") -eq "LPARC Photo" })
          if ($entries.Count -ne 1) { throw "expected one installed entry after upgrading, found $($entries.Count)" }
          Write-Host "installed version: $($entries[0].GetValue('DisplayVersion'))"

          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left the app behind" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks and ad-hoc signature intact; plain zip breaks them.
        run: ditto -c -k --keepParent "dist/LPARC Photo.app" "LPARC-Photo-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/LPARC Photo" -DestinationPath "LPARC-Photo-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LPARC-Photo-${{ matrix.name }}
          path: |
            LPARC-Photo-${{ matrix.name }}.zip
            LPARC-Photo-${{ matrix.name }}-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            LPARC-Photo-*.zip
            LPARC-Photo-*-setup.exe
          generate_release_notes: true
