server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Stable links to share: they always lead to the newest release on GitHub.
    location = /download/windows   { return 302 https://github.com/kkonkobo/lparc-photo/releases/latest/download/LPARC-Photo-windows-x64.zip; }
    location = /download/mac       { return 302 https://github.com/kkonkobo/lparc-photo/releases/latest/download/LPARC-Photo-macos-arm64.zip; }
    location = /download/mac-intel { return 302 https://github.com/kkonkobo/lparc-photo/releases/latest/download/LPARC-Photo-macos-intel.zip; }

    location = /health { default_type text/plain; return 200 "ok\n"; }

    # Which commit this container was built from; the deploy workflow checks it.
    location = /version.json { add_header Cache-Control "no-cache" always; }

    location /assets/ { expires 7d; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}
