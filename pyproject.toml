[project]
name = "lparc-photo"
version = "2.2.0"
description = "ID photos from a webcam, named by matricule"
readme = "README.md"
authors = [
    { name = "Khalyl Konkobo", email = "58838718+kkonkobo@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2",
    # onnxruntime stopped publishing Intel-Mac wheels after 1.23.
    "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.20,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11",
    "pyside6>=6.8",
]

[project.scripts]
lparc-photo = "lparc_photo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=9.2.0",
]
